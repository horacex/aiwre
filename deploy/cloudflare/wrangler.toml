name = "aiwre-relay-horace"
main = "worker.js"
compatibility_date = "2026-02-14"

[vars]
MAX_BODY_BYTES = "131072"
FEED_MAX = "500"
CORS_ORIGIN = "*"
DEFAULT_TOPICS = "global.announce"
HEARTBEAT_TOPIC = "agent.heartbeat"
REPORT_TOPIC = "human.report"
SHARD_COUNT = "32"
BATCH_MAX = "100"
SHARD_RETENTION = "5000"
QUEUE_BATCH_MAX = "100"

[[kv_namespaces]]
binding = "AIWRE_MESSAGES"
id = "8c2b313ee3684eb29833c4b1fe575dee"
preview_id = "747fa7a059b6490cbd32e6dd3f08c004"

[durable_objects]
bindings = [
  { name = "TOPIC_SHARD", class_name = "TopicShardDO" }
]

[[migrations]]
tag = "v2-topic-shard-20260214"
new_sqlite_classes = ["TopicShardDO"]

[[queues.producers]]
binding = "AIWRE_INGRESS"
queue = "aiwre-ingress-horace"

[[queues.consumers]]
queue = "aiwre-ingress-horace"
max_batch_size = 100
max_batch_timeout = 2
max_retries = 3
